name: Legacy PHP 7.4 isolated tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/php74-isolated.yml'
      - 'app/**'
      - 'composer.json'
      - 'composer.lock'
      - 'database/**'
      - 'phpunit.xml'
      - 'routes/**'
      - 'scripts/test-isolated.sh'
      - 'tests/**'
permissions:
  contents: read
jobs:
  php74:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    container:
      image: php:7.4-cli-bullseye@sha256:620a6b9f4d4feef2210026172570465e9d0c1de79766418d3affd09190a7fda5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system packages and required PHP extensions
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20261020T000000Z bullseye main' \
            'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian-security/20261020T000000Z bullseye-security main' \
            > /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*
          # Legacy Bullseye security index references removed packages (404).
          # Restrict this disposable, non-production PHP 7.4 container to the
          # main Bullseye repository; never use this image for deployment.
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          rm -rf /var/lib/apt/lists/*
          apt-get -o Acquire::Retries=3 update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git unzip libcurl4-openssl-dev libgmp-dev libsqlite3-dev libxml2-dev libzip-dev
          docker-php-ext-install curl gmp pdo_sqlite xmlrpc zip
      - name: Install Composer 2.2 LTS
        run: |
          curl -fsSL https://getcomposer.org/download/2.2.25/composer.phar -o /tmp/composer.phar
          php /tmp/composer.phar --version
      - name: Install locked dependencies without application scripts
        env:
          COMPOSER_ALLOW_SUPERUSER: '1'
        run: php /tmp/composer.phar install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Block outbound network during tests
        run: |
          # The test runner itself is not a network sandbox. Do not provide secrets.
          # An isolated, disposable checkout and empty environment are enforced by the runner.
          bash scripts/test-isolated.sh
